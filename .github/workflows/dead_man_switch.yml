name: Dead Man Switch
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_and_destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Check Ping and Destroy
        run: |
          MAX_DAYS=7
          FILE_TO_DESTROY="Mapas/Cariñosas/HojaDeDios.json"
          
          if [ ! -f "last_ping.txt" ]; then
            echo "No ping file, exiting."
            exit 0
          fi
          
          LAST_PING=$(cat last_ping.txt)
          CURRENT_TIME=$(date +%s)
          DIFF=$((CURRENT_TIME - LAST_PING))
          DAYS=$((DIFF / 86400))
          
          echo "Días inactivo: $DAYS / $MAX_DAYS"
          
          if [ $DAYS -ge $MAX_DAYS ]; then
            echo "¡TIEMPO EXPIRADO! Ejecutando auto-destrucción..."
            echo "[]" > "$FILE_TO_DESTROY"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE_TO_DESTROY"
            git commit -m "🚨 AUTO-DESTRUCCIÓN: Licencia expirada" || echo "Nada que commitear"
            git push
          else
            echo "Sistema seguro."
          fi
